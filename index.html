<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AP Spanish Trainer</title>
  <!-- Tailwind CSS via CDN for zero-build ChromeOS & Netlify deployment -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Identity Services for client-side Google Sign-In & Google Drive AppData sync -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('ap_spanish_user_prefs_v1');
        if (raw) {
          var prefs = JSON.parse(raw);
          if (prefs && prefs.themeMode) {
            document.documentElement.setAttribute('data-theme', prefs.themeMode);
          }
          if (prefs && prefs.fontSize) {
            document.documentElement.setAttribute('data-font-size', prefs.fontSize);
          }
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./styles/themes.css" />
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- Toast Notification Container (Replaces alert/confirm) -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Word Lookup Popover (Active only in Study -> Chunk/Phrase Tests when enabled) -->
  <div id="word-lookup-popover" class="hidden fixed bg-white border border-slate-300 rounded-2xl shadow-xl p-3 text-left space-y-1.5 pointer-events-auto" role="dialog" aria-label="Word definition">
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span id="lookup-pop-es" class="text-sm font-extrabold text-indigo-700 break-words"></span>
          <span id="lookup-pop-pos" class="px-1.5 py-0.5 rounded-md bg-slate-100 text-[10px] font-bold uppercase tracking-wider text-slate-600"></span>
        </div>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="lookup-pop-speak-btn" type="button" class="p-1 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs transition cursor-pointer" title="Listen pronunciation">🔊</button>
        <button id="lookup-pop-close-btn" type="button" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 text-xs font-bold transition cursor-pointer" title="Close">✕</button>
      </div>
    </div>
    <div id="lookup-pop-en" class="text-xs sm:text-sm font-semibold text-slate-900 leading-snug"></div>
    <div id="lookup-pop-meta" class="hidden text-[11px] text-slate-500"></div>
  </div>

  <!-- Custom Confirmation Modal -->
  <div id="confirm-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-slate-200">
      <h3 id="confirm-title" class="text-lg font-bold text-slate-900 mb-2">Confirm Action</h3>
      <p id="confirm-message" class="text-sm text-slate-600 mb-6 leading-relaxed"></p>
      <div class="flex justify-end gap-3">
        <button id="confirm-cancel-btn" class="px-4 py-2.5 rounded-xl text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 transition">
          Cancel
        </button>
        <button id="confirm-ok-btn" class="px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-rose-600 hover:bg-rose-700 transition">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <!-- Top Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3.5">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <!-- Brand & Title -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-lg shadow-sm">
              AP
            </div>
            <div>
              <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight leading-tight">
                AP Spanish Trainer
              </h1>
              <p class="text-xs text-slate-500">Daily Phrases, Speaking &amp; Cultural Practice</p>
            </div>
          </div>
        </div>

        <!-- Stats Badges & Voice Selector -->
        <div class="flex flex-wrap items-center gap-2 sm:gap-3">
          <div class="flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-800 px-3 py-1.5 rounded-xl text-xs font-semibold" title="Cards currently due for review today plus your daily new-phrase allowance">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>
            <span>Due Today: <strong id="stat-due">0</strong></span>
          </div>
          <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-800 px-3 py-1.5 rounded-xl text-xs font-semibold" title="Phrases you have reviewed with an interval of 7+ days">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span>Mastered: <strong id="stat-mastered">0</strong></span>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-100 border border-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold" title="Total study phrases loaded in your deck across all grade levels (7,300 per grade + custom cards)">
            <span>Total Phrases: <strong id="stat-total">0</strong></span>
          </div>

          <!-- 1-Click Sign in with Google Button -->
          <button id="header-google-signin-btn" type="button" class="flex items-center gap-2 bg-white hover:bg-slate-50 border border-slate-300 text-slate-800 px-3.5 py-1.5 rounded-xl text-xs font-semibold shadow-2xs transition cursor-pointer" title="Sign in with Google to save & sync your progress to Google Drive">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.37 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.37 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96z"/>
            </svg>
            <span id="drive-sync-badge" class="max-w-[160px] truncate">Sign in with Google</span>
          </button>

          <!-- How to Use Guide Button -->
          <button id="open-help-btn" type="button" class="flex items-center gap-1.5 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-800 px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer" title="How to Use This App">
            <span class="w-4 h-4 rounded-full bg-indigo-600 text-white inline-flex items-center justify-center text-[10px] font-bold">?</span>
            <span>How to Use</span>
          </button>

          <!-- Unified Settings Menu Button (Color Modes, Voice, & Study Preferences) -->
          <button id="open-settings-btn" type="button" class="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-800 px-3 py-1.5 rounded-xl text-xs font-semibold transition cursor-pointer" title="Settings: Color Modes, Spanish Voice, & Study Preferences">
            <span id="audio-engine-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" title="Voice status"></span>
            <span>Settings</span>
            <span id="header-theme-badge" class="hidden sm:inline-block px-1.5 py-0.5 rounded-md bg-white border border-slate-200 text-[10px] font-bold text-slate-600">Light</span>
            <svg class="w-3.5 h-3.5 text-slate-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex gap-1.5 mt-3.5 overflow-x-auto pb-1" aria-label="Tabs">
        <button data-tab="study" class="tab-btn active px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap bg-indigo-600 text-white shadow-xs">
          1. Study (SRS)
        </button>
        <button data-tab="add" class="tab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-600 hover:bg-slate-100">
          2. Preply Quick-Add
        </button>
        <button data-tab="speaking" class="tab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-600 hover:bg-slate-100">
          3. 2-Min Speaking Challenge
        </button>
        <button data-tab="manage" class="tab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition whitespace-nowrap text-slate-600 hover:bg-slate-100">
          4. Manage &amp; Sync Deck
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6">

    <!-- ==================== TAB 1: STUDY (SRS) ==================== -->
    <section id="tab-study" class="tab-panel space-y-5">
      <!-- Study Sub-Tabs (Next-Level Modes) -->
      <div class="bg-white px-3 py-2.5 rounded-2xl border border-slate-200 shadow-xs flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5" role="tablist" aria-label="Study test types">
          <button type="button" data-study-subtab="chunks" class="study-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap bg-indigo-600 text-white shadow-xs cursor-pointer">
            1) Chunk / Phrase Tests
          </button>
          <button type="button" data-study-subtab="vocab" class="study-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap text-slate-600 hover:bg-slate-100 cursor-pointer">
            2) Vocab Test
          </button>
          <button type="button" data-study-subtab="conjugation" class="study-subtab-btn px-3.5 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap text-slate-600 hover:bg-slate-100 cursor-pointer">
            3) Conjugation Test
          </button>
        </div>
        <span id="study-subtab-summary" class="text-[11px] font-medium text-slate-500 px-1">
          Contextual SRS sentences with SM-2 spacing
        </span>
      </div>

      <div data-partial="./partials/study-chunks.html"></div>
      <div data-partial="./partials/vocab-quiz.html"></div>
      <div data-partial="./partials/conjugation.html"></div>
    </section>

    <div data-partial="./partials/preply-add.html"></div>
    <div data-partial="./partials/speaking.html"></div>
    <div data-partial="./partials/manage-deck.html"></div>

  </main>

  <!-- Minimal Public Footer (Required for Google OAuth Branding Verification) -->
  <footer class="border-t border-slate-200/80 bg-white/70 mt-8">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
      <span>AP Spanish Trainer • Open-Source Study Tool</span>
      <div class="flex items-center gap-4">
        <a href="./privacy.html" class="hover:text-indigo-600 underline transition">Privacy Policy</a>
        <a href="./tos.html" class="hover:text-indigo-600 underline transition">Terms of Service</a>
        <a href="https://github.com/sabujp/ap-spanish-trainer" target="_blank" rel="noopener noreferrer" class="hover:text-indigo-600 underline transition">GitHub</a>
      </div>
    </div>
  </footer>

  <div data-partial="./partials/modals.html"></div>

  <!-- ==================== APPLICATION CONFIG & LOGIC ==================== -->
  <script src="./config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
