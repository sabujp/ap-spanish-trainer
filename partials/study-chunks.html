<!-- ===== SUB-TAB 1: CHUNK / PHRASE TESTS (SRS) ===== -->
<div id="study-subpanel-chunks" class="study-subpanel space-y-5">
  <!-- Filter & Mode Controls -->
  <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-2.5">
      <label for="study-level-filter" class="text-xs font-semibold uppercase tracking-wider text-slate-500">Level:</label>
      <select id="study-level-filter" class="bg-emerald-50/70 border border-emerald-200 text-emerald-950 text-sm rounded-xl px-3 py-2 font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <option value="ALL">All Levels (9th → 12th)</option>
        <option value="1">Level 1: 9th Grade Foundations</option>
        <option value="2">Level 2: 10th Grade Intermediate</option>
        <option value="3">Level 3: 11th Grade Pre-AP</option>
        <option value="4">Level 4: 12th Grade AP Mastery</option>
      </select>

      <label for="study-theme-filter" class="text-xs font-semibold uppercase tracking-wider text-slate-500">Theme:</label>
      <select id="study-theme-filter" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 font-medium focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <option value="ALL">All AP Themes</option>
        <option value="Argument & Connectors">Argument &amp; Connectors</option>
        <option value="Global Challenges">Global Challenges</option>
        <option value="Science & Technology">Science &amp; Technology</option>
        <option value="Contemporary Life">Contemporary Life</option>
        <option value="Personal & Public Identities">Personal &amp; Public Identities</option>
        <option value="Families & Communities">Families &amp; Communities</option>
        <option value="Beauty & Aesthetics">Beauty &amp; Aesthetics</option>
      </select>

      <!-- Daily New-Card Pace Cap -->
      <div class="flex items-center gap-1.5 bg-indigo-50/80 border border-indigo-100 px-3 py-1.5 rounded-xl text-xs">
        <span class="font-semibold text-indigo-900">New Today:</span>
        <strong id="daily-new-progress" class="text-indigo-700">0 / 20</strong>
        <label for="daily-new-limit-select" class="sr-only">New cards per day limit</label>
        <select id="daily-new-limit-select" class="ml-1 bg-white border border-indigo-200 rounded-lg px-1.5 py-0.5 text-[11px] font-bold text-indigo-800 focus:outline-none" title="Maximum new unstudied cards introduced per day">
          <option value="5">5/day</option>
          <option value="10">10/day</option>
          <option value="15">15/day</option>
          <option value="20" selected>20/day</option>
          <option value="30">30/day</option>
          <option value="9999">Unlimited</option>
        </select>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200">
        <button id="mode-due-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-700 shadow-xs transition">
          Due Only
        </button>
        <button id="mode-all-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition">
          Practice All
        </button>
      </div>
      <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 cursor-pointer select-none" title="Enable Speaking Detection Mode to speak your answers into the microphone (auto-adds Spanish accents)">
        <input type="checkbox" id="chunks-voice-mode-checkbox" class="rounded text-indigo-600 focus:ring-indigo-500" />
        <span>🎙️ Voice Mode</span>
      </label>
      <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 cursor-pointer select-none" title="Show instant English definitions when hovering or highlighting Spanish words in Study cards (saved to Drive)">
        <input type="checkbox" id="word-lookup-checkbox" class="rounded text-indigo-600 focus:ring-indigo-500" />
        <span>Word Lookup</span>
      </label>
      <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 cursor-pointer select-none" title="Automatically focus the blank input on each card so you can start typing immediately">
        <input type="checkbox" id="auto-focus-type-checkbox" class="rounded text-indigo-600 focus:ring-indigo-500" />
        <span>Focus Typing</span>
      </label>
      <label class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-600 cursor-pointer select-none">
        <input type="checkbox" id="auto-tts-checkbox" checked class="rounded text-indigo-600 focus:ring-indigo-500" />
        <span>Auto-Speak</span>
      </label>
    </div>
  </div>

  <!-- Flashcard Container -->
  <div id="flashcard-area" class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-10 min-h-[340px] flex flex-col justify-between transition-all">
    <!-- Populated dynamically by JS -->
  </div>

  <!-- Keyboard Shortcut Footer Hint -->
  <div class="flex flex-wrap items-center justify-center gap-4 text-xs text-slate-400">
    <span><kbd class="px-1.5 py-0.5 bg-white border border-slate-300 rounded text-slate-600 font-mono">Enter</kbd> Type / Check</span>
    <span><kbd class="px-1.5 py-0.5 bg-white border border-slate-300 rounded text-slate-600 font-mono">Space</kbd> Reveal Answer</span>
    <span><kbd class="px-1.5 py-0.5 bg-white border border-slate-300 rounded text-slate-600 font-mono">R</kbd> Listen Audio</span>
    <span><kbd class="px-1.5 py-0.5 bg-white border border-slate-300 rounded text-slate-600 font-mono">1</kbd>–<kbd class="px-1.5 py-0.5 bg-white border border-slate-300 rounded text-slate-600 font-mono">4</kbd> Rate Card</span>
  </div>
</div>
